  <text x="146" y="78" font-size="10.5" fill="#6b6b6b" text-anchor="middle">useChatStream</text>

  <rect x="292" y="14" width="244" height="78" rx="12" fill="#fdf7f9" stroke="#d23669" stroke-width="2"/>
  <text x="414" y="38" font-size="10" font-weight="700" letter-spacing="1.2" fill="#d23669" text-anchor="middle">WEB UI · NEW</text>
  <text x="414" y="58" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ad2955" text-anchor="middle">src/web/client/ · React</text>
  <text x="414" y="78" font-size="10.5" fill="#6b6b6b" text-anchor="middle">useAgentChat</text>

  <line x1="146" y1="92" x2="146" y2="126" stroke="#d23669" stroke-width="2" marker-end="url(#ap)"/>
  <line x1="414" y1="92" x2="414" y2="126" stroke="#d23669" stroke-width="2" marker-end="url(#ap)"/>

  <rect x="24" y="128" width="512" height="64" rx="12" fill="#fdf7f9" stroke="#d23669" stroke-width="2.5"/>
  <text x="280" y="152" font-size="10" font-weight="800" letter-spacing="1.4" fill="#d23669" text-anchor="middle">THE SEAM — src/agent-io.ts</text>
  <text x="280" y="176" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#1a1a1a" text-anchor="middle">send(payload): AsyncIterable&lt;AgentChunk&gt;</text>

  <line x1="280" y1="192" x2="280" y2="212" stroke="#d23669" stroke-width="2" marker-end="url(#ap)"/>

  <rect x="24" y="214" width="512" height="58" rx="10" fill="#faf9f6" stroke="#b8b2a7" stroke-width="1.5"/>
  <text x="280" y="238" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ad2955" text-anchor="middle">src/shared/ — stream-fold · chunks · catalog</text>
  <text x="280" y="258" font-size="10.5" fill="#6b6b6b" text-anchor="middle">pure calculations · bundle into browser, host &amp; Flue alike</text>

  <rect x="24" y="280" width="512" height="58" rx="10" fill="#faf9f6" stroke="#b8b2a7" stroke-width="1.5"/>
  <text x="280" y="304" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ad2955" text-anchor="middle">src/agents · profiles · tools · runner</text>
  <text x="280" y="324" font-size="10.5" fill="#6b6b6b" text-anchor="middle">agent definitions, lesson-file tools, the Flue launcher</text>

