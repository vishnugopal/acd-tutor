<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 552" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d23669"/>
    </marker>
  </defs>

  <rect x="24" y="14" width="244" height="78" rx="12" fill="#fbfaf8" stroke="#b8b2a7" stroke-width="1.5"/>
  <text x="146" y="38" font-size="10" font-weight="700" letter-spacing="1.2" fill="#6b6b6b" text-anchor="middle">TERMINAL UI</text>
