  <text x="155" y="92" font-size="10.5" fill="#6b6b6b" text-anchor="middle">autosave · planSync after each reply</text>

  <rect x="390" y="20" width="270" height="104" rx="12" fill="#fbfaf8" stroke="#b8b2a7" stroke-width="1.5"/>
  <text x="525" y="46" font-size="10" font-weight="700" letter-spacing="1.2" fill="#6b6b6b" text-anchor="middle">AGENT · Flue tools</text>
  <text x="525" y="70" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ad2955" text-anchor="middle">writeFile · openFile · readFile</text>
