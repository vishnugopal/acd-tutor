  <path d="M 480 124 C 470 196, 430 230, 400 276" fill="none" stroke="#d23669" stroke-width="2" marker-end="url(#p2)"/>
  <text x="436" y="170" font-size="10.5" fill="#d23669" text-anchor="middle">openFile →</text>
  <text x="436" y="185" font-size="10.5" fill="#d23669" text-anchor="middle">.open-request</text>

  <path d="M 215 278 C 150 235, 150 200, 175 126" fill="none" stroke="#3b6ec7" stroke-width="2" marker-end="url(#b2)"/>
