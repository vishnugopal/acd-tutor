  <text x="340" y="328" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#ad2955" text-anchor="middle">lesson-1.ts · lesson-2.ts · …</text>
  <text x="340" y="350" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#9b958c" text-anchor="middle">.open-request (hidden)</text>

  <path d="M 150 124 C 150 210, 215 220, 245 276" fill="none" stroke="#2b7a4b" stroke-width="2" marker-end="url(#g2)"/>
  <text x="120" y="200" font-size="10.5" fill="#2b7a4b" text-anchor="middle">autosave →</text>
  <text x="120" y="216" font-size="10.5" fill="#2b7a4b" text-anchor="middle">PUT /files</text>

  <path d="M 530 124 C 530 210, 470 222, 440 276" fill="none" stroke="#2b7a4b" stroke-width="2" marker-end="url(#g2)"/>
